
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="/manifest.json">
  <title>Receipt Snap</title>
  <style>
    :root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { margin:0; background:#f5f5f7; color:#111; }
    .wrap { max-width:720px; margin:auto; padding:22px 16px 80px; }
    .top { display:flex; justify-content:space-between; align-items:end; gap:12px; }
    h1 { margin:0; font-size:30px; }
    .sub { color:#666; margin-top:4px; }
    .card { background:#fff; border-radius:22px; padding:18px; margin-top:18px; box-shadow:0 4px 18px rgba(0,0,0,.06); }
    .snap { display:block; width:100%; padding:20px 16px; border:0; border-radius:18px; font-size:21px; font-weight:750; background:#111; color:white; cursor:pointer; text-align:center; box-sizing:border-box; }
    input[type=file] { display:none; }
    .status { text-align:center; min-height:24px; margin-top:12px; font-weight:600; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
    .stat { background:#fff; border-radius:18px; padding:16px; }
    .stat b { font-size:24px; display:block; }
    .row { display:grid; grid-template-columns:1fr auto; gap:12px; padding:14px 0; border-top:1px solid #eee; }
    .row:first-child { border-top:0; }
    .vendor { font-weight:750; font-size:17px; }
    .meta { color:#666; font-size:14px; margin-top:3px; }
    .amount { font-weight:800; font-size:18px; }
    .pill { display:inline-block; margin-top:5px; padding:4px 8px; background:#efefef; border-radius:999px; font-size:12px; }
    .actions { display:flex; gap:10px; margin-top:12px; }
    .linkbtn { flex:1; text-decoration:none; color:#111; background:#fff; border:1px solid #ddd; border-radius:14px; padding:12px; text-align:center; font-weight:650; }
    img.thumb { width:52px; height:52px; border-radius:10px; object-fit:cover; float:left; margin-right:10px; }
    .empty { color:#777; text-align:center; padding:18px 0; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Receipt Snap</h1>
      <div class="sub">Take the picture. The app does the rest.</div>
    </div>
  </div>

  <div class="card">
    <label class="snap" for="camera">📸 Take Receipt Picture</label>
    <input id="camera" type="file" accept="image/*" capture="environment">
    <div id="status" class="status"></div>
  </div>

  <div class="stats">
    <div class="stat"><span>This month</span><b id="monthTotal">$0.00</b></div>
    <div class="stat"><span>Receipts</span><b id="monthCount">0</b></div>
  </div>

  <div class="actions">
    <a class="linkbtn" href="/api/export.csv">Export CSV</a>
    <button class="linkbtn" onclick="loadReceipts()">Refresh</button>
  </div>

  <div class="card">
    <h2 style="margin-top:0">Recent receipts</h2>
    <div id="list"><div class="empty">No receipts yet.</div></div>
  </div>
</div>

<script>
const camera = document.getElementById('camera');
const statusEl = document.getElementById('status');

camera.addEventListener('change', async () => {
  const file = camera.files[0];
  if (!file) return;
  statusEl.textContent = "Reading receipt…";
  const form = new FormData();
  form.append("receipt", file, file.name || "receipt.jpg");
  try {
    const res = await fetch("/api/scan", { method:"POST", body:form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Scan failed");
    statusEl.textContent = `Saved: ${data.vendor || "Receipt"} — $${Number(data.total || 0).toFixed(2)}`;
    camera.value = "";
    await Promise.all([loadReceipts(), loadSummary()]);
  } catch (e) {
    statusEl.textContent = e.message;
  }
});

async function loadReceipts() {
  const rows = await fetch("/api/receipts").then(r=>r.json());
  const list = document.getElementById("list");
  if (!rows.length) {
    list.innerHTML = '<div class="empty">No receipts yet.</div>';
    return;
  }
  list.innerHTML = rows.map(r => `
    <div class="row">
      <div>
        <img class="thumb" src="/receipts/${encodeURIComponent(r.image_name)}" alt="">
        <div class="vendor">${escapeHtml(r.vendor || "Unknown vendor")}</div>
        <div class="meta">${escapeHtml(r.receipt_date || "")} · ${escapeHtml(r.description || "")}</div>
        <span class="pill">${escapeHtml(r.category || "Other")}</span>
      </div>
      <div class="amount">$${Number(r.total || 0).toFixed(2)}</div>
    </div>`).join("");
}

async function loadSummary() {
  const s = await fetch("/api/summary").then(r=>r.json());
  document.getElementById("monthTotal").textContent = "$" + Number(s.total || 0).toFixed(2);
  document.getElementById("monthCount").textContent = s.count || 0;
}

function escapeHtml(v) {
  return String(v ?? "").replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  })[m]);
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
loadReceipts();
loadSummary();
</script>
</body>
</html>
